{% extends "base.html" %}

{% block title %}페이지를 찾을 수 없음 | Tiny Market{% endblock %}

{% block content %}
<section class="error-page">
    <div class="error-card">
        <span class="error-code">404</span>
        <h1>페이지를 찾을 수 없습니다.</h1>
        <p>
            주소가 잘못되었거나 삭제 또는 차단된 페이지일 수 있습니다.
        </p>

        <div class="error-actions">
            <a href="{{ url_for('index') }}" class="button button-primary">
                홈으로 이동
            </a>

            <a href="{{ url_for('product_list') }}" class="button button-secondary">
                상품 둘러보기
            </a>
        </div>
    </div>
</section>
{% endblock %}
