{% extends "base.html" %}

{% block title %}요청 크기 초과 | Tiny Market{% endblock %}

{% block content %}
<section class="error-page">
    <div class="error-card">
        <span class="error-code">413</span>

        <h1>요청 데이터가 너무 큽니다.</h1>

        <p>
            한 번에 전송할 수 있는 데이터의 크기를 초과했습니다.
            입력 내용을 줄인 뒤 다시 시도해 주세요.
        </p>

        <div class="error-actions">
            <a
                href="{{ url_for('index') }}"
                class="button button-primary"
            >
                홈으로 이동
            </a>

            <a
                href="{{ url_for('product_list') }}"
                class="button button-secondary"
            >
                상품 둘러보기
            </a>
        </div>
    </div>
</section>
{% endblock %}
